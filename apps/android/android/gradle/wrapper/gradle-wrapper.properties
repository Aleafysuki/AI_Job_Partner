distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# ---------------------------------------------------------------------------
# Gradle 发行版下载地址。
#
# 原值留痕（Capacitor 生成的默认值，勿删）：
#     distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-all.zip
#
# 为什么换成腾讯云镜像：本机实测 services.gradle.org 只有约 30KB/s，
# 而这个包有 210MB —— 按那个速度要将近两小时，构建根本跑不完。
# 同一时刻实测 mirrors.cloud.tencent.com 约 18MB/s（约 12 秒）。
# 镜像站上的发行版与官方一致（按 md5 同步），而且是 `-all` 不是 `-bin`，
# 与原来的完整发行版等价。
#
# 回到官方源：把下面这行换回上面注释里的原值即可。
# ---------------------------------------------------------------------------
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.14.3-all.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
